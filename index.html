<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#e9e3d5;
    --ink-dim:#a89e8c;
    --bg:#14181c;
    --surface:#1b2126;
    --surface-2:#20272d;
    --line:#333c42;
    --seal:#b23a2e;
    --seal-dim:#7a2822;
    --brass:#a8823d;
    --jade:#5c8a6b;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(178,58,46,0.06), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(168,130,61,0.05), transparent 45%);
  }
  .mono{ font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .serif{ font-family:'Noto Serif TC', serif; }

  /* ---------- 登入畫面 ---------- */
  #gate{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px;
    text-align:center;
    gap:28px;
  }
  #gate .mark{
    width:64px; height:64px;
    display:flex; align-items:center; justify-content:center;
  }
  #gate h1{
    font-family:'Noto Serif TC', serif;
    font-size:28px;
    font-weight:700;
    letter-spacing:0.04em;
  }
  #gate p{ color:var(--ink-dim); font-size:14px; max-width:320px; line-height:1.7; }
  #loginBtn{
    background:var(--seal);
    color:#f4ede0;
    border:none;
    padding:14px 32px;
    font-family:'Noto Sans TC', sans-serif;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.05em;
    border-radius:var(--radius);
    cursor:pointer;
    transition:background 0.2s;
  }
  #loginBtn:hover{ background:#c94636; }
  #loginBtn:focus-visible{ outline:2px solid var(--brass); outline-offset:3px; }
  #gateStatus{ font-size:13px; color:var(--ink-dim); min-height:18px; }

  /* ---------- 儀表板 ---------- */
  #dash{ display:none; max-width:920px; margin:0 auto; padding:20px 16px 64px; }
  header.top{
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:20px 4px 24px;
    border-bottom:1px solid var(--line);
    margin-bottom:28px;
  }
  header.top .brand-cn{ font-family:'Noto Serif TC',serif; font-size:22px; font-weight:700; }
  header.top .brand-vn{ font-size:11px; color:var(--ink-dim); letter-spacing:0.12em; margin-top:2px; }
  .data-range{ font-size:11px; color:var(--brass); margin-top:4px; }
  .customer-select{
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:2px;
    padding:6px 10px; font-size:12px; font-family:'Noto Sans TC',sans-serif;
    margin-top:8px;
  }
  header.top .updated{ font-size:11px; color:var(--ink-dim); text-align:right; }
  header.top .updated .dot{ color:var(--jade); }

  /* Hero numbers */
  .hero{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:14px;
    margin-bottom:28px;
  }
  @media (max-width:560px){ .hero{ grid-template-columns:1fr; } }
  .hero-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px 22px;
    position:relative;
    overflow:hidden;
  }
  .hero-card.primary{ border-left:3px solid var(--seal); }
  .hero-card.secondary{ border-left:3px solid var(--brass); }
  .hero-label{ font-size:12px; color:var(--ink-dim); letter-spacing:0.08em; margin-bottom:10px; }
  .hero-number{ font-family:'IBM Plex Mono', monospace; font-size:36px; font-weight:600; letter-spacing:-0.01em; }
  .hero-number small{ font-size:16px; color:var(--ink-dim); margin-left:4px; font-weight:400;}
  .hero-sub{ font-size:12px; color:var(--ink-dim); margin-top:8px; }

  /* 印章 status chip */
  .chop{
    display:inline-flex; align-items:center; gap:5px;
    border:1.5px solid var(--seal);
    color:var(--seal);
    font-size:11px;
    font-weight:700;
    padding:2px 9px;
    border-radius:3px;
    transform:rotate(-3deg);
    letter-spacing:0.05em;
    white-space:nowrap;
  }
  .chop.done{ border-color:var(--jade); color:var(--jade); transform:rotate(2deg); }

  /* Section */
  .section-title{
    display:flex; align-items:baseline; gap:10px;
    margin:32px 0 14px;
  }
  .section-title .num{ font-family:'IBM Plex Mono',monospace; color:var(--brass); font-size:13px; }
  .section-title h2{ font-family:'Noto Serif TC',serif; font-size:17px; font-weight:700; }
  .section-title .count{ color:var(--ink-dim); font-size:12px; margin-left:auto; }

  /* 待出貨 ledger rows */
  .ledger{ border-top:1px solid var(--line); }
  .ledger-row{
    display:grid;
    grid-template-columns:1fr auto auto auto;
    gap:14px;
    align-items:center;
    padding:14px 4px;
    border-bottom:1px dashed var(--line);
  }
  @media (max-width:560px){
    .ledger-row{ grid-template-columns:1fr; gap:6px; }
    .ledger-row .r-qty, .ledger-row .r-code{ font-size:12px; }
  }
  .ledger-row .r-name{ font-size:14px; }
  .ledger-row .r-code{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dim); }
  .ledger-row .r-qty{ font-family:'IBM Plex Mono',monospace; font-size:14px; text-align:right; color:var(--seal); font-weight:600; }
  .ledger-row .r-date{ font-size:11px; color:var(--ink-dim); text-align:right; }

  .empty{ padding:28px 4px; color:var(--ink-dim); font-size:13px; text-align:center; }

  /* 月度趨勢 */
  .trend-row{
    display:grid;
    grid-template-columns:90px 1fr auto 56px;
    gap:12px;
    align-items:center;
    padding:11px 4px;
    border-bottom:1px dashed var(--line);
  }
  .trend-row .t-month{ font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-dim); }
  .trend-row .t-bar-track{ background:var(--surface-2); border-radius:2px; height:10px; overflow:hidden; }
  .trend-row .t-bar-fill{ height:100%; background:var(--brass); border-radius:2px; }
  .trend-row.is-current .t-bar-fill{ background:var(--seal); }
  .trend-row .t-amount{ font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:right; white-space:nowrap; }
  .trend-row .t-change{ font-family:'IBM Plex Mono',monospace; font-size:12px; text-align:right; font-weight:600; }
  .trend-row .t-change.up{ color:var(--jade); }
  .trend-row .t-change.down{ color:var(--seal); }
  .trend-row .t-change.flat{ color:var(--ink-dim); }
  .trend-row .t-yoy{ display:block; font-size:10px; color:var(--ink-dim); text-align:right; margin-top:2px; }
  .trend-row .t-yoy.up{ color:var(--jade); }
  .trend-row .t-yoy.down{ color:var(--seal); }

  .mom-chip{
    display:inline-flex; align-items:center; gap:4px;
    font-size:13px; font-weight:700; margin-top:6px;
  }
  .mom-chip.up{ color:var(--jade); }
  .mom-chip.down{ color:var(--seal); }
  .mom-chip.flat{ color:var(--ink-dim); }

  /* 週期切換 */
  .period-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .period-tab{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    padding:7px 16px; font-size:12px; font-weight:700; border-radius:3px; cursor:pointer;
    font-family:'Noto Sans TC',sans-serif;
  }
  .period-tab.active{ border-color:var(--brass); color:var(--brass); background:rgba(168,130,61,0.08); }

  .period-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:8px;
  }
  .period-grid.four{ grid-template-columns:repeat(4, 1fr); }
  @media (max-width:560px){
    .period-grid{ grid-template-columns:repeat(2, 1fr); }
    .period-grid.four{ grid-template-columns:repeat(2, 1fr); }
  }
  .period-card{
    background:var(--surface); border:1px solid var(--line); border-radius:2px;
    padding:14px 12px;
  }
  .period-card .p-label{ font-size:11px; color:var(--ink-dim); margin-bottom:8px; }
  .period-card .p-amount{ font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600; }
  .period-card .p-sub{ font-size:11px; color:var(--ink-dim); margin-top:6px; }
  .period-card .p-yoy{ font-size:11px; font-weight:700; margin-top:4px; }
  .period-card .p-yoy.up{ color:var(--jade); }
  .period-card .p-yoy.down{ color:var(--seal); }
  .period-card .p-yoy.flat{ color:var(--ink-dim); font-weight:400; }

  /* 產品備貨分析 */
  .stock-row{
    display:grid;
    grid-template-columns:1fr auto auto auto auto;
    gap:14px;
    align-items:center;
    padding:13px 4px;
    border-bottom:1px dashed var(--line);
  }
  @media (max-width:640px){
    .stock-row{ grid-template-columns:1fr; gap:4px; }
    .stock-row .s-metric{ display:flex; justify-content:space-between; font-size:12px; }
    .stock-row .s-metric .s-metric-label{ color:var(--ink-dim); }
  }
  .stock-row .s-name{ font-size:14px; }
  .stock-row .s-code{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dim); }
  .stock-row .s-num{ font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:right; white-space:nowrap; }
  .stock-row .s-num .s-num-label{ display:block; font-size:10px; color:var(--ink-dim); font-family:'Noto Sans TC',sans-serif; margin-bottom:2px; }
  .stock-row .s-trend{ font-size:11px; font-weight:700; }
  .stock-row .s-trend.up{ color:var(--jade); }
  .stock-row .s-trend.down{ color:var(--seal); }
  .stock-row .s-trend.flat{ color:var(--ink-dim); }
  .stock-row .s-num .s-trend-mini{ font-size:10px; margin-left:4px; }
  .stock-row .s-num .s-trend-mini.up{ color:var(--jade); }
  .stock-row .s-num .s-trend-mini.down{ color:var(--seal); }
  .stock-row .s-num .s-trend-mini.flat{ color:var(--ink-dim); }

  /* 頂層分頁 */
  .main-tabs{
    display:flex; gap:8px; margin:24px 0 20px;
    border-bottom:1px solid var(--line);
  }
  .main-tab{
    background:transparent; border:none; color:var(--ink-dim);
    padding:10px 4px; font-size:14px; font-weight:700; cursor:pointer;
    font-family:'Noto Serif TC',serif;
    border-bottom:2px solid transparent;
    margin-right:20px;
  }
  .main-tab.active{ color:var(--seal); border-bottom-color:var(--seal); }

  /* 產品分類標題 */
  .category-header{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--brass);
    letter-spacing:0.1em;
    padding:16px 4px 8px;
    border-bottom:1px solid var(--line);
    margin-top:6px;
  }
  .category-header:first-child{ margin-top:0; }

  .watchlist-block{
    background:var(--surface); border:1px solid var(--seal-dim); border-left:3px solid var(--seal);
    border-radius:2px; padding:4px 14px; margin-bottom:24px;
  }
  .watchlist-title{
    font-family:'Noto Serif TC',serif; font-size:14px; font-weight:700; color:var(--seal);
    padding:12px 0 4px;
  }
  .watch-row{
    display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;
    padding:10px 0; border-bottom:1px dashed var(--line);
  }
  .watch-row:last-child{ border-bottom:none; }
  .watch-row .w-name{ font-size:13px; }
  .watch-row .w-code{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dim); }
  .watch-row .w-tag{ font-size:11px; font-weight:700; color:var(--seal); white-space:nowrap; }

  /* footer / reload */
  .foot{ margin-top:40px; display:flex; justify-content:center; }
  .reload{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    padding:9px 18px; font-size:12px; border-radius:var(--radius); cursor:pointer;
  }
  .reload:hover{ border-color:var(--brass); color:var(--brass); }

  .trend-toggle{
    display:none; width:100%; margin-top:10px;
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    padding:9px 18px; font-size:12px; border-radius:var(--radius); cursor:pointer;
  }
  .trend-toggle:hover{ border-color:var(--brass); color:var(--brass); }

  #errBox{
    display:none;
    background:var(--surface-2); border:1px solid var(--seal-dim);
    color:var(--ink); padding:16px; border-radius:var(--radius);
    font-size:13px; line-height:1.7; margin-bottom:20px; white-space:pre-wrap;
  }
</style>
</head>
<body>

<!-- 登入畫面 -->
<div id="gate">
  <div class="mark">
    <img src="logo.jpg" alt="LOOP POWER" style="width:80px; height:auto; display:block;">
  </div>
  <h1>訂單儀表板</h1>
  <p>用你獲授權的 Google 帳號登入，即可查看即時業績與出貨狀態。資料僅顯示於你的畫面，不會外流。</p>
  <button id="loginBtn">用 Google 帳號登入查看</button>
  <div id="gateStatus"></div>
</div>

<!-- 儀表板 -->
<div id="dash">
  <header class="top">
    <div>
      <div class="brand-cn" id="brandCn">得力 DELICACY</div>
      <div class="brand-vn" id="brandVn">ĐƠN HÀNG DELICACY · 訂單儀表板</div>
      <div class="data-range" id="dataRange"></div>
      <select class="customer-select" id="customerSelect" onchange="switchCustomer(this.value)"></select>
    </div>
    <div class="updated"><span class="dot">●</span> 已同步最新資料</div>
  </header>

  <div id="errBox"></div>

  <div class="hero" style="grid-template-columns:1fr;">
    <div class="hero-card primary">
      <div class="hero-label">本月業績</div>
      <div class="hero-number mono" id="monthRevenue">—</div>
      <div class="hero-sub" id="momSub">—</div>
    </div>
  </div>

  <div class="hero" style="grid-template-columns:1fr;">
    <div class="hero-card" style="border-left:3px solid var(--line);">
      <div class="hero-label">尚待出貨品項</div>
      <div class="hero-number mono" id="pendingCount">—</div>
      <div class="hero-sub" id="pendingQtySub">—</div>
    </div>
  </div>

  <div class="section-title">
    <span class="num">01</span>
    <h2>待出貨清單</h2>
    <span class="count" id="pendingListCount"></span>
  </div>
  <div class="ledger" id="pendingList">
    <div class="empty">讀取中…</div>
  </div>

  <div class="main-tabs">
    <button class="main-tab active" id="mainTabRevenue" onclick="switchMainTab('revenue')">業績金額</button>
    <button class="main-tab" id="mainTabQty" onclick="switchMainTab('qty')">產品分析</button>
  </div>

  <!-- ===== 業績金額分頁 ===== -->
  <div id="panelRevenue">
    <div id="customerBreakdown" style="display:none;"></div>

    <div class="section-title">
      <span class="num">02</span>
      <h2>業績週期比較</h2>
    </div>
    <div class="period-tabs">
      <button class="period-tab active" id="tabCalendar" onclick="switchPeriodTab('calendar')">日曆制（月／季／年）</button>
      <button class="period-tab" id="tabRolling" onclick="switchPeriodTab('rolling')">移動天數（近N天）</button>
    </div>
    <div class="period-grid" id="calendarGrid"></div>
    <div class="period-grid four" id="rollingGrid" style="display:none;"></div>

    <div class="section-title">
      <span class="num">03</span>
      <h2>月度業績走勢</h2>
      <span class="count" id="trendMonthCount"></span>
    </div>
    <div class="ledger" id="trendList">
      <div class="empty">讀取中…</div>
    </div>
    <button class="trend-toggle" id="trendToggleBtn" onclick="toggleTrendHistory()">顯示更早的月份 ▾</button>
  </div>

  <!-- ===== 訂單產品數量分頁 ===== -->
  <div id="panelQty" style="display:none;">
    <div class="section-title">
      <span class="num">02</span>
      <h2>產品備貨分析</h2>
      <span class="count" id="stockListCount"></span>
    </div>
    <div id="watchlistBlock"></div>
    <div class="ledger" id="stockList">
      <div class="empty">讀取中…</div>
    </div>
  </div>

  <div class="foot">
    <button class="reload" id="reloadBtn">重新整理資料</button>
  </div>
</div>

<script>
/* ====== 設定區 ====== */
const CLIENT_ID = "171109654782-ngcl41juffgr1nrc4csjfk8n050bt11g.apps.googleusercontent.com";

  { label: '德昂 DEON VN', brandCn: '德昂 DEON VN', brandVn: 'ĐƠN HÀNG DEON VN · 訂單儀表板', query: 'DEON VN' },
  { label: '德皇 ĐỨC HOÀNG', brandCn: '德皇 ĐỨC HOÀNG', brandVn: 'ĐƠN HÀNG ĐỨC HOÀNG · 訂單儀表板', query: 'ĐỨC HOÀNG' },
  { label: '儒鴻 ECLAT', brandCn: '儒鴻 ECLAT', brandVn: 'ĐƠN HÀNG ECLAT · 訂單儀表板', query: 'ECLAT' },

  { label: '蘭陳 LAN TRẦN', brandCn: '蘭陳 LAN TRẦN', brandVn: 'ĐƠN HÀNG LAN TRẦN · 訂單儀表板', query: 'LAN TRẦN' },
  { label: 'NEEU', brandCn: 'NEEU', brandVn: 'ĐƠN HÀNG NEEU · 訂單儀表板', query: 'NEEU' },
  { label: '歐昇 ALL SEVEN', brandCn: '歐昇 ALL SEVEN', brandVn: 'ĐƠN HÀNG ALL SEVEN · 訂單儀表板', query: 'ALL SEVEN' },
  { label: '綠平福 BÌNH PHƯỚC XANH', brandCn: '綠平福 BÌNH PHƯỚC XANH', brandVn: 'ĐƠN HÀNG BÌNH PHƯỚC XANH · 訂單儀表板', query: 'BÌNH PHƯỚC XANH' },
  { label: '展越 CHAIN YARN', brandCn: '展越 CHAIN YARN', brandVn: 'ĐƠN HÀNG CHAIN YARN · 訂單儀表板', query: 'CHAIN YARN' },

/* 客戶排序永久保存：存在瀏覽器 localStorage，重開網頁/裝置不會遺失，直到下次跑總覽才會更新 */
const CUSTOMER_ORDER_KEY = 'dashboard_customerOrder_v1';

function saveCustomerOrder(sortedLabels){
  try{ localStorage.setItem(CUSTOMER_ORDER_KEY, JSON.stringify(sortedLabels)); }catch(e){ console.warn('無法儲存客戶排序', e); }
}

function loadCustomerOrder(){
  try{
    const raw = localStorage.getItem(CUSTOMER_ORDER_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

/* 依已保存的順序（若有）排列下拉選單，若尚未存過排序則用原始順序 */
function populateCustomerSelect(){
  const sel = document.getElementById('customerSelect');
  const aggregateIdx = CUSTOMERS.findIndex(c => c.isAggregate);
  const savedOrder = loadCustomerOrder();
  let orderedIdx;
  if(savedOrder && savedOrder.length){
    const labelToIdx = {};
    CUSTOMERS.forEach((c,i) => { labelToIdx[c.label] = i; });
    const matchedIdx = savedOrder.map(l => labelToIdx[l]).filter(i => i !== undefined);
    // 新加入、尚未出現在保存排序裡的客戶，補到最後，避免消失
    const missingIdx = CUSTOMERS.map((c,i) => i).filter(i => i !== aggregateIdx && !matchedIdx.includes(i));
    orderedIdx = [aggregateIdx, ...matchedIdx, ...missingIdx];
  } else {
    orderedIdx = CUSTOMERS.map((c,i) => i);
  }
  sel.innerHTML = orderedIdx.map(i => `<option value="${i}">${escapeHtml(CUSTOMERS[i].label)}</option>`).join('');
  sel.value = 1;
}

/* 依「各客戶業績排行」的順序，重新排列選單的顯示順序（value 仍對應 CUSTOMERS 原始索引，不影響其他邏輯），並永久保存 */
function reorderCustomerSelect(sortedLabels){
  const sel = document.getElementById('customerSelect');
  const currentValue = sel.value;
  const aggregateIdx = CUSTOMERS.findIndex(c => c.isAggregate);
  const labelToIdx = {};
  CUSTOMERS.forEach((c,i) => { labelToIdx[c.label] = i; });
  const matchedIdx = sortedLabels.map(l => labelToIdx[l]).filter(i => i !== undefined);
  const missingIdx = CUSTOMERS.map((c,i) => i).filter(i => i !== aggregateIdx && !matchedIdx.includes(i));
  const orderedIdx = [aggregateIdx, ...matchedIdx, ...missingIdx];
  sel.innerHTML = orderedIdx.map(i => `<option value="${i}">${escapeHtml(CUSTOMERS[i].label)}</option>`).join('');
  sel.value = currentValue;
  // 保存這次排序，下次開網頁直接套用，不用重新跑總覽
  saveCustomerOrder(orderedIdx.filter(i => i !== aggregateIdx).map(i => CUSTOMERS[i].label));
}

async function loadData(){
  document.getElementById('errBox').style.display = 'none';
  if(currentCustomer.isAggregate){
    await loadAllCustomers();
    return;
  }
  try{
    const fileId = await findFile(currentCustomer.query);
    const buf = await downloadFile(fileId);
    const workbook = XLSX.read(buf, {type:'array', cellDates:true});
    const sheetName = workbook.SheetNames.find(n => n.includes(SHEET_NAME_HINT)) || workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
    const { orders, shipments } = parseLedger(rows);
    orders.forEach(it => it.customerLabel = currentCustomer.label);
    shipments.forEach(it => it.customerLabel = currentCustomer.label);
    render(shipments, orders, false);
  } catch(err){
    console.error(err);
    showError('讀取資料時發生問題：\n' + (err.message || err) + '\n\n請確認檔案名稱包含「' + currentCustomer.query + '」，且你的 Google 帳號有檢視權限。');
  }
}

async function loadAllCustomers(){
  const realCustomers = CUSTOMERS.filter(c => !c.isAggregate);
  const allOrders = [];
  const allShipments = [];
  const failed = [];
  for(const c of realCustomers){
    try{
      const fileId = await findFile(c.query);
      const buf = await downloadFile(fileId);
      const workbook = XLSX.read(buf, {type:'array', cellDates:true});
      const sheetName = workbook.SheetNames.find(n => n.includes(SHEET_NAME_HINT)) || workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      const { orders, shipments } = parseLedger(rows);
      orders.forEach(it => it.customerLabel = c.label);
      shipments.forEach(it => it.customerLabel = c.label);
      allOrders.push(...orders);
      allShipments.push(...shipments);
    } catch(err){
      console.error(c.label, err);
      failed.push(c.label);
    }
  }
  if(failed.length > 0){
    showError('以下客戶讀取失敗，總覽數字不包含這些客戶：\n' + failed.join('、'));
  }
  render(allShipments, allOrders, true);
}

async function findFile(query){
  const q = encodeURIComponent(`name contains '${query}' and trashed = false`);
  const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&pageSize=10`;
  const res = await fetch(url, { headers:{ Authorization:`Bearer ${accessToken}` }});
  if(!res.ok) throw new Error('搜尋檔案失敗 (HTTP ' + res.status + ')');
  const data = await res.json();
  if(!data.files || data.files.length === 0) throw new Error('找不到名稱包含「' + query + '」的檔案');
  // 取最近修改的那個
  data.files.sort((a,b) => new Date(b.modifiedTime) - new Date(a.modifiedTime));
  return data.files[0].id;
}

async function downloadFile(fileId){
  const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
  const res = await fetch(url, { headers:{ Authorization:`Bearer ${accessToken}` }});
  if(!res.ok){
    let detail = '';
    try{
      const errJson = await res.json();
      detail = errJson.error ? (errJson.error.message || JSON.stringify(errJson.error)) : JSON.stringify(errJson);
    }catch(e){
      try{ detail = await res.text(); }catch(e2){ detail = '(無法讀取錯誤內容)'; }
    }
    throw new Error(`下載檔案失敗 (HTTP ${res.status})\n詳細原因：${detail}`);
  }
  return await res.arrayBuffer();
}

/* 解析帳本：自動找標題列，再依關鍵字比對欄位。
   表格結構：每一列是一筆訂單（訂單日期／訂數量／還欠），
   分隔線「////////」之後，每一欄的表頭是一個出貨日期，欄位裡的數字就是那天出的貨量
   （同一筆訂單可能分好幾次出貨，分散在好幾個出貨日期欄位）。
   回傳 { orders, shipments }：
   - orders：訂單本身，只用在「待出貨清單」跟「還欠」判斷（維持看訂單，不受本次調整影響）
   - shipments：拆開後的每一筆實際出貨紀錄，業績／用量／月度走勢都改用這個計算 */
function parseLedger(rows){
  let headerRowIdx = -1;
  let headerRow = null;
  for(let i=0;i<Math.min(rows.length, 15);i++){
    const row = rows[i].map(c => String(c));
    if(row.some(c => c.includes('訂單號碼') || c.includes('代碼'))){
      headerRowIdx = i;
      headerRow = row;
      break;
    }
  }
  if(headerRowIdx === -1) throw new Error('找不到表格標題列，可能表格結構有變動');

  const findCol = (keywords) => {
    for(let i=0;i<headerRow.length;i++){
      const cell = headerRow[i];
      if(keywords.some(k => cell.includes(k))) return i;
    }
    return -1;
  };

  const colDate   = findCol(['訂單日期','NN']);
  const colCode   = findCol(['代碼']);
  const colName   = findCol(['Tên hàng','品名']);
  const colPrice  = findCol(['GIA','單價']);
  const colQty    = findCol(['SLĐ','訂數量']);
  const colOwed   = findCol(['nợ','還欠']);
  const colDivider = headerRow.findIndex(c => c.includes('////////'));

  // 出貨欄位：分隔線之後、表頭能解析成日期的欄位，每一欄代表一個出貨日
  const shipCols = [];
  if(colDivider >= 0){
    for(let c = colDivider+1; c < headerRow.length; c++){
      const d = toDateObj(headerRow[c]);
      if(d){
        shipCols.push({ idx:c, dateObj:d, monthKey:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, dateStr: fmtDateShort(d) });
      }
    }
  }

  const orders = [];
  const shipments = [];
  for(let i=headerRowIdx+1;i<rows.length;i++){
    const row = rows[i];
    const code = colCode>=0 ? String(row[colCode]||'').trim() : '';
    const name = colName>=0 ? String(row[colName]||'').trim() : '';
    if(!code && !name) continue;
    const price = colPrice>=0 ? parseFloat(String(row[colPrice]).replace(/,/g,'')) || 0 : 0;
    const qty   = colQty>=0 ? parseFloat(String(row[colQty]).replace(/,/g,'')) || 0 : 0;
    const owed  = colOwed>=0 ? parseFloat(String(row[colOwed]).replace(/,/g,'')) || 0 : 0;
    // 過濾雜訊列：代碼／品名純數字（多半是誤讀到合計列或日期欄位），且沒有任何實際訂單金額
    const looksLikeJunk = /^[\d.,]+$/.test(code) && /^[\d.,]+$/.test(name || '0');
    if(looksLikeJunk && price === 0 && qty === 0 && owed === 0) continue;
    // 數量跟還欠都是0，代表不是真正的訂單列（可能是合併儲存格造成的殘留列），一律排除
    if(qty === 0 && owed === 0) continue;
    const rawDate = colDate>=0 ? row[colDate] : '';
    const dateObj = toDateObj(rawDate);
    const monthKey = dateObj ? `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}` : null;
    const date = dateObj ? fmtDateShort(dateObj) : String(rawDate||'').trim();
    const priceMissing = qty > 0 && price === 0;

    orders.push({ code, name, price, qty, owed, date, monthKey, dateObj, priceMissing });

    for(const sc of shipCols){
      const raw = row[sc.idx];
      if(raw === '' || raw === null || raw === undefined) continue;
      const shipQty = parseFloat(String(raw).replace(/,/g,''));
      if(!shipQty || shipQty <= 0) continue;
      shipments.push({
        code, name, price,
        qty: shipQty,
        amount: price * shipQty,
        date: sc.dateStr,
        dateObj: sc.dateObj,
        monthKey: sc.monthKey,
        priceMissing
      });
    }
  }
  return { orders, shipments };
}

/* 將儲存格原始值（可能是 Date 物件／Excel 序號／文字字串）統一轉成 Date 物件，失敗回傳 null */
function toDateObj(raw){
  if(!raw && raw !== 0) return null;
  if(raw instanceof Date && !isNaN(raw)) return raw;
  if(typeof raw === 'number'){
    // Excel 序號日期（1900 曆制），轉換為 JS Date
    const ms = Math.round((raw - 25569) * 86400 * 1000);
    const d = new Date(ms);
    return isNaN(d) ? null : d;
  }
  const str = String(raw).trim();
  const m = str.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(!m) return null;
  const day = parseInt(m[1],10), mon = parseInt(m[2],10);
  let yr = parseInt(m[3],10);
  if(yr < 100) yr += 2000; // 兩位數年份（例如 25 → 2025）
  if(mon < 1 || mon > 12 || day < 1 || day > 31) return null;
  return new Date(yr, mon-1, day);
}

function monthLabel(key){
  const [y,m] = key.split('-');
  return `${y}年${m}月`;
}

function fmtInt(n){ return Math.round(n).toLocaleString('zh-Hant'); }

function fmtDateShort(d){
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

/* 計算兩字串的編輯距離（Levenshtein distance），用於抓出疑似打錯字的相近代碼 */
function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0] = i;
  for(let j=0;j<=n;j++) dp[0][j] = j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      if(a[i-1] === b[j-1]) dp[i][j] = dp[i-1][j-1];
      else dp[i][j] = 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function render(shipments, orders, isAggregate){
  const pending = orders.filter(i => i.owed > 0);
  const pendingQty = pending.reduce((s,i)=>s+i.owed,0);

  document.getElementById('pendingCount').textContent = pending.length;
  document.getElementById('pendingQtySub').textContent = `合計還欠 ${fmtInt(pendingQty)} 公斤`;

  /* ---- 資料涵蓋範圍：顯示最早一筆有日期的出貨紀錄，方便判斷資料是不是被搬走了一部分 ---- */
  const datedItems = shipments.filter(i => i.dateObj);
  const dataRangeEl = document.getElementById('dataRange');
  if(datedItems.length === 0){
    dataRangeEl.textContent = '';
  } else {
    const earliest = datedItems.reduce((min,i) => i.dateObj < min ? i.dateObj : min, datedItems[0].dateObj);
    dataRangeEl.textContent = `資料涵蓋：${earliest.getFullYear()}年${earliest.getMonth()+1}月起`;
  }

  /* ---- 各客戶業績排行（僅在「全部客戶總覽」模式顯示）---- */
  const customerBreakdownEl = document.getElementById('customerBreakdown');
  if(isAggregate){
    const byCustomer = {};
    shipments.forEach(i => {
      const label = i.customerLabel || '未知客戶';
      if(!byCustomer[label]) byCustomer[label] = { total:0, thisMonth:0 };
      byCustomer[label].total += i.amount;
    });
    const nowRef = new Date();
    shipments.forEach(i => {
      if(i.dateObj && i.dateObj.getFullYear()===nowRef.getFullYear() && i.dateObj.getMonth()===nowRef.getMonth()){
        const label = i.customerLabel || '未知客戶';
        byCustomer[label].thisMonth += i.amount;
      }
    });
    const rows = Object.entries(byCustomer).sort((a,b) => b[1].total - a[1].total);
    customerBreakdownEl.style.display = 'block';
    customerBreakdownEl.innerHTML = `
      <div class="section-title">
        <span class="num">00</span>
        <h2>各客戶業績排行</h2>
        <span class="count">${rows.length} 家</span>
      </div>
      <div class="ledger">
        ${rows.map(([label, v]) => `
          <div class="ledger-row">
            <div><div class="r-name">${escapeHtml(label)}</div></div>
            <div class="r-qty">${fmtInt(v.total)} đ</div>
            <div class="chop done">本月 ${fmtInt(v.thisMonth)} đ</div>
            <div class="r-date"></div>
          </div>
        `).join('')}
      </div>
    `;
    // 依業績排行的順序，重新排列客戶下拉選單（讓最常用/業績最高的客戶排在前面，方便切換）
    reorderCustomerSelect(rows.map(([label]) => label));
  } else {
    customerBreakdownEl.style.display = 'none';
    customerBreakdownEl.innerHTML = '';
  }

  /* ---- 業績週期比較：日曆制 vs 移動天數制（以出貨為準）---- */
  const today = new Date();
  today.setHours(23,59,59,999);
  const withDate = shipments.filter(i => i.dateObj);

  // 日曆制：本月／本季／本年
  const curY = today.getFullYear(), curM = today.getMonth(); // 0-based
  const curQ = Math.floor(curM/3);
  const sumIf = (pred) => withDate.filter(pred).reduce((s,i)=>s+i.amount,0);

  const monthTotal = sumIf(i => i.dateObj.getFullYear()===curY && i.dateObj.getMonth()===curM);
  const quarterTotal = sumIf(i => i.dateObj.getFullYear()===curY && Math.floor(i.dateObj.getMonth()/3)===curQ);
  const yearTotal = sumIf(i => i.dateObj.getFullYear()===curY);

  // 去年同期比較，抓淡旺季用
  const lyMonthTotal = sumIf(i => i.dateObj.getFullYear()===curY-1 && i.dateObj.getMonth()===curM);
  const lyQuarterTotal = sumIf(i => i.dateObj.getFullYear()===curY-1 && Math.floor(i.dateObj.getMonth()/3)===curQ);
  const lyYearTotal = sumIf(i => i.dateObj.getFullYear()===curY-1);

  const yoyHtml = (curVal, lyVal) => {
    if(lyVal === 0){
      return curVal > 0 ? '<div class="p-yoy flat">去年同期無資料</div>' : '';
    }
    const diff = curVal - lyVal;
    const pct = diff / lyVal * 100;
    const dir = pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat');
    const arrow = pct > 0 ? '▲' : (pct < 0 ? '▼' : '—');
    return `<div class="p-yoy ${dir}">${arrow} ${Math.abs(pct).toFixed(0)}% 較去年同期</div>`;
  };

  const calendarGrid = document.getElementById('calendarGrid');
  calendarGrid.innerHTML = `
    <div class="period-card"><div class="p-label">本月</div><div class="p-amount mono">${fmtInt(monthTotal)} đ</div><div class="p-sub">${curY}年${curM+1}月</div>${yoyHtml(monthTotal, lyMonthTotal)}</div>
    <div class="period-card"><div class="p-label">本季</div><div class="p-amount mono">${fmtInt(quarterTotal)} đ</div><div class="p-sub">${curY}年第${curQ+1}季</div>${yoyHtml(quarterTotal, lyQuarterTotal)}</div>
    <div class="period-card"><div class="p-label">本年</div><div class="p-amount mono">${fmtInt(yearTotal)} đ</div><div class="p-sub">${curY}年全年</div>${yoyHtml(yearTotal, lyYearTotal)}</div>
  `;

  // 移動天數制：近30/90/180/365天（以今天為基準往回推）
  const daysAgo = (n) => {
    const d = new Date(today);
    d.setDate(d.getDate() - n);
    d.setHours(0,0,0,0);
    return d;
  };
  const rollingWindows = [ [30,'近30天'], [90,'近90天'], [180,'近180天'], [365,'近365天'] ];
  const rollingGrid = document.getElementById('rollingGrid');
  rollingGrid.innerHTML = rollingWindows.map(([n,label]) => {
    const from = daysAgo(n);
    const total = sumIf(i => i.dateObj >= from && i.dateObj <= today);
    return `<div class="period-card"><div class="p-label">${label}</div><div class="p-amount mono">${fmtInt(total)} đ</div><div class="p-sub">${fmtDateShort(from)} 起</div></div>`;
  }).join('');

  // 本月業績卡（沿用月度比較，維持在頂部 hero）
  document.getElementById('monthRevenue').innerHTML = fmtInt(monthTotal) + '<small>đ</small>';
  const prevMonthDate = new Date(curY, curM-1, 1);
  const prevMonthTotal = sumIf(i => i.dateObj.getFullYear()===prevMonthDate.getFullYear() && i.dateObj.getMonth()===prevMonthDate.getMonth());
  if(prevMonthTotal > 0 || monthTotal > 0){
    const diff = monthTotal - prevMonthTotal;
    const pct = prevMonthTotal !== 0 ? (diff/prevMonthTotal*100) : 0;
    const dir = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
    const arrow = diff > 0 ? '▲' : (diff < 0 ? '▼' : '—');
    document.getElementById('momSub').innerHTML =
      prevMonthTotal !== 0
        ? `<span class="mom-chip ${dir}">${arrow} ${Math.abs(pct).toFixed(1)}%</span> 較上月`
        : '上月無資料可比較';
  } else {
    document.getElementById('momSub').textContent = '本月尚無訂單資料';
  }

  /* ---- 月度業績走勢（以出貨月份計算）---- */
  const monthMap = {};
  shipments.forEach(i => {
    if(!i.monthKey) return;
    monthMap[i.monthKey] = (monthMap[i.monthKey] || 0) + i.amount;
  });
  const monthKeys = Object.keys(monthMap).sort(); // 由舊到新
  const trendListEl = document.getElementById('trendList');
  document.getElementById('trendMonthCount').textContent = monthKeys.length + ' 個月';

  if(monthKeys.length === 0){
    trendListEl.innerHTML = '<div class="empty">找不到可辨識的訂單日期，暫無法統計月度走勢</div>';
  } else {
    const maxAmount = Math.max(...monthKeys.map(k => monthMap[k]));

    // 由新到舊全部渲染，超過 6 個月的部分先隱藏，靠「顯示更早的月份」按鈕展開
    const allMonths = monthKeys.slice().reverse();
    trendListEl.innerHTML = allMonths.map((key, idx) => {
      const amt = monthMap[key];
      const barPct = maxAmount > 0 ? Math.max(4, Math.round(amt / maxAmount * 100)) : 0;
      const prevIdx = monthKeys.indexOf(key) - 1;
      let changeHtml = '<span class="t-change flat">—</span>';
      if(prevIdx >= 0){
        const prevAmt = monthMap[monthKeys[prevIdx]];
        const d = amt - prevAmt;
        const p = prevAmt !== 0 ? (d/prevAmt*100) : 0;
        const dir = d > 0 ? 'up' : (d < 0 ? 'down' : 'flat');
        const arrow = d > 0 ? '▲' : (d < 0 ? '▼' : '—');
        changeHtml = `<span class="t-change ${dir}">${arrow} ${Math.abs(p).toFixed(0)}%</span>`;
      }
      // 去年同月比較（抓淡旺季用）
      const [yy, mm] = key.split('-');
      const yoyKey = `${parseInt(yy,10)-1}-${mm}`;
      let yoyHtmlRow = '';
      if(monthMap[yoyKey] !== undefined){
        const lyAmt = monthMap[yoyKey];
        const d2 = amt - lyAmt;
        const p2 = lyAmt !== 0 ? (d2/lyAmt*100) : 0;
        const dir2 = d2 > 0 ? 'up' : (d2 < 0 ? 'down' : 'flat');
        const arrow2 = d2 > 0 ? '▲' : (d2 < 0 ? '▼' : '—');
        yoyHtmlRow = `<span class="t-yoy ${dir2}">去年同月 ${arrow2}${Math.abs(p2).toFixed(0)}%</span>`;
      }
      return `
        <div class="trend-row ${idx===0 ? 'is-current' : ''} ${idx>=6 ? 'trend-extra' : ''}" ${idx>=6 ? 'style="display:none;"' : ''}>
          <div class="t-month">${monthLabel(key)}</div>
          <div class="t-bar-track"><div class="t-bar-fill" style="width:${barPct}%"></div></div>
          <div class="t-amount">${fmtInt(amt)} đ</div>
          <div>${changeHtml}${yoyHtmlRow}</div>
        </div>
      `;
    }).join('');

    const trendToggleBtn = document.getElementById('trendToggleBtn');
    trendExpanded = false;
    if(allMonths.length > 6){
      trendToggleBtn.style.display = 'block';
      trendToggleBtn.textContent = '顯示更早的月份 ▾';
    } else {
      trendToggleBtn.style.display = 'none';
    }
  }

  /* ---- 產品備貨分析：依產品分類彙整全期月均、近7天、近30天動態（以出貨為準） ---- */
  const productMap = {};
  const getPM = (code, name) => {
    const key = code || name;
    if(!key) return null;
    if(!productMap[key]) productMap[key] = {
      code, name, totalQty:0, owed:0, months:new Set(), recent7Qty:0, recent30Qty:0,
      latestPrice:0, latestPriceDate:null, orderCount:0, firstDate:null, lastDate:null,
      // 下單面（跟出貨面分開追蹤，用來判斷「近30天無下單」）
      orderMonths:new Set(), recentOrder30Qty:0, firstOrderDate:null, lastOrderDate:null
    };
    return productMap[key];
  };
  const sevenDaysAgo = new Date(today); sevenDaysAgo.setDate(sevenDaysAgo.getDate()-7); sevenDaysAgo.setHours(0,0,0,0);
  const thirtyDaysAgo = new Date(today); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate()-30); thirtyDaysAgo.setHours(0,0,0,0);
  // 用量／全期月均／近7天／近30天／目前單價：全部以「實際出貨」計算
  withDate.forEach(i => {
    const pm = getPM(i.code, i.name);
    if(!pm) return;
    pm.totalQty += i.qty;
    pm.months.add(i.monthKey);
    if(!pm.firstDate || i.dateObj < pm.firstDate) pm.firstDate = i.dateObj;
    if(!pm.lastDate || i.dateObj > pm.lastDate) pm.lastDate = i.dateObj;
    if(i.dateObj >= sevenDaysAgo && i.dateObj <= today) pm.recent7Qty += i.qty;
    if(i.dateObj >= thirtyDaysAgo && i.dateObj <= today) pm.recent30Qty += i.qty;
    // 追蹤該產品「最新一筆有填單價」的出貨，作為目前單價參考
    if(i.price > 0 && (!pm.latestPriceDate || i.dateObj > pm.latestPriceDate)){
      pm.latestPrice = i.price;
      pm.latestPriceDate = i.dateObj;
    }
  });
  // 還欠數量／訂單筆數：維持看訂單本身（跟出貨無關，這部分邏輯不變）
  orders.forEach(i => {
    const pm = getPM(i.code, i.name);
    if(!pm) return;
    pm.owed += i.owed;
    pm.orderCount += 1;
    if(i.dateObj){
      pm.orderMonths.add(i.monthKey);
      if(!pm.firstOrderDate || i.dateObj < pm.firstOrderDate) pm.firstOrderDate = i.dateObj;
      if(!pm.lastOrderDate || i.dateObj > pm.lastOrderDate) pm.lastOrderDate = i.dateObj;
      if(i.dateObj >= thirtyDaysAgo && i.dateObj <= today) pm.recentOrder30Qty += i.qty;
    }
  });

  /* ---- 自動合併疑似誤植的代碼：比對「品名／代碼／單價」三項，符合2項以上視為同一產品 ---- */
  // 只保留有實際出貨紀錄的產品才進行用量分析（純訂單、還沒出過貨的產品沒有可分析的用量趨勢，
  // 但還是會透過「待出貨清單」單獨呈現，不會遺漏）
  let rawProducts = Object.values(productMap).filter(p => p.firstDate && p.lastDate);
  const normName = (n) => String(n||'').trim().toUpperCase().replace(/\s+/g,' ');
  const parent = rawProducts.map((_,i) => i);
  function find(x){ while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  function union(a,b){ const ra=find(a), rb=find(b); if(ra!==rb) parent[ra]=rb; }

  for(let i=0;i<rawProducts.length;i++){
    for(let j=i+1;j<rawProducts.length;j++){
      const a = rawProducts[i], b = rawProducts[j];
      if(a.code === b.code) continue;
      const nameMatch = normName(a.name) === normName(b.name) && normName(a.name) !== '';
      const codeMatch = a.code && b.code && a.code.toUpperCase() === b.code.toUpperCase(); // 完全相符（僅忽略大小寫），非相似度比對
      const priceMatch = a.latestPrice > 0 && b.latestPrice > 0 && a.latestPrice === b.latestPrice; // 完全相等，不做容許誤差
      const matchCount = [nameMatch, codeMatch, priceMatch].filter(Boolean).length;
      if(matchCount >= 2) union(i, j);
    }
  }

  const mergeGroups = {};
  rawProducts.forEach((p, idx) => {
    const root = find(idx);
    if(!mergeGroups[root]) mergeGroups[root] = [];
    mergeGroups[root].push(p);
  });

  const mergeLog = []; // 記錄自動合併的動作，供透明化顯示
  rawProducts = Object.values(mergeGroups).map(group => {
    if(group.length === 1) return group[0];
    // 以「訂單筆數最多」的那個視為正確代碼，其餘合併進去
    group.sort((a,b) => b.orderCount - a.orderCount);
    const canonical = group[0];
    const merged = { ...canonical, months:new Set(canonical.months), orderMonths:new Set(canonical.orderMonths) };
    for(let k=1;k<group.length;k++){
      const dup = group[k];
      merged.totalQty += dup.totalQty;
      merged.owed += dup.owed;
      merged.recent7Qty += dup.recent7Qty;
      merged.recent30Qty += dup.recent30Qty;
      merged.recentOrder30Qty += dup.recentOrder30Qty;
      merged.orderCount += dup.orderCount;
      dup.months.forEach(m => merged.months.add(m));
      dup.orderMonths.forEach(m => merged.orderMonths.add(m));
      if(dup.firstDate < merged.firstDate) merged.firstDate = dup.firstDate;
      if(dup.lastDate > merged.lastDate) merged.lastDate = dup.lastDate;
      if(dup.firstOrderDate && (!merged.firstOrderDate || dup.firstOrderDate < merged.firstOrderDate)) merged.firstOrderDate = dup.firstOrderDate;
      if(dup.lastOrderDate && (!merged.lastOrderDate || dup.lastOrderDate > merged.lastOrderDate)) merged.lastOrderDate = dup.lastOrderDate;
      if(dup.latestPriceDate && (!merged.latestPriceDate || dup.latestPriceDate > merged.latestPriceDate)){
        merged.latestPrice = dup.latestPrice;
        merged.latestPriceDate = dup.latestPriceDate;
      }
      mergeLog.push({ from: dup, into: canonical });
    }
    return merged;
  });



  const CATEGORY_ORDER = ['分散','酸性','反應','鹽基','HeiQ','助劑'];
  const DYE_CATEGORIES = ['分散','酸性','反應','鹽基']; // 這幾類要再依染料顏色細分排序
  function categorize(name){
    const upper = String(name||'').toUpperCase();
    if(upper.includes('MEKICRON') || upper.includes('MINCRON')) return '分散';
    if(upper.includes('SUNACID')) return '酸性';
    if(upper.includes('SUNAZOL')) return '反應';
    if(upper.includes('SUNACRYL')) return '鹽基';
    if(upper.includes('HEIQ')) return 'HeiQ';
    return '助劑';
  }

  // 顏色偵測順序（NAVY 要排在 BLUE 前面比對，避免 "NAVY BLUE" 被誤判成藍）；sortIndex 決定顯示順序：黃橘紅藍丈青紫黑
  const COLOR_DEFS = [
    { key:'YELLOW',   sortIndex:0, subIndex:0 },
    { key:'ORANGE',   sortIndex:1, subIndex:0 },
    { key:'RED',      sortIndex:2, subIndex:0 },
    { key:'RUBINE',   sortIndex:2, subIndex:1 },
    { key:'BORDEAUX', sortIndex:2, subIndex:2 },
    { key:'NAVY',     sortIndex:4, subIndex:0 },
    { key:'BLUE',     sortIndex:3, subIndex:0 },
    { key:'PURPLE',   sortIndex:5, subIndex:0 },
    { key:'VIOLET',   sortIndex:5, subIndex:0 },
    { key:'BLACK',    sortIndex:6, subIndex:0 },
  ];
  function colorSortIndex(name){
    const upper = String(name||'').toUpperCase();
    for(const c of COLOR_DEFS){
      if(upper.includes(c.key)) return c.sortIndex * 10 + c.subIndex;
    }
    return 999; // 無法辨識顏色的排最後
  }

  const stockListEl = document.getElementById('stockList');
  const watchlistEl = document.getElementById('watchlistBlock');
  const products = rawProducts;
  document.getElementById('stockListCount').textContent = products.length + ' 項';

  const trendOf = (actual, expected) => {
    const diff = actual - expected;
    const pct = expected !== 0 ? (diff/expected*100) : (actual > 0 ? 100 : 0);
    const dir = pct > 20 ? 'up' : (pct < -20 ? 'down' : 'flat');
    const arrow = dir==='up' ? '▲' : (dir==='down' ? '▼' : '—');
    return { dir, arrow, pct };
  };

  if(products.length === 0){
    stockListEl.innerHTML = '<div class="empty">尚無可辨識日期的訂購資料</div>';
    watchlistEl.innerHTML = '';
  } else {
    products.forEach(p => {
      p.monthCount = Math.max(p.months.size, 1);
      p.fullAvg = p.totalQty / p.monthCount;
      p.expected7d = p.fullAvg * (7/30);
      p.expected30d = p.fullAvg;
      p.t7 = trendOf(p.recent7Qty, p.expected7d);
      p.t30 = trendOf(p.recent30Qty, p.expected30d);
      // 出貨面規律性：活躍期間（首次~最後一次出貨）內，有出貨的月份佔比多高
      const spanMonths = (p.lastDate.getFullYear()*12 + p.lastDate.getMonth()) - (p.firstDate.getFullYear()*12 + p.firstDate.getMonth()) + 1;
      p.activeSpanMonths = spanMonths;
      p.regularity = p.months.size / spanMonths;
      p.daysSinceLastShip = Math.floor((today - p.lastDate) / 86400000);
      // 下單面規律性：活躍期間（首次~最後一次下單）內，有下單的月份佔比多高（跟出貨面分開算）
      if(p.firstOrderDate && p.lastOrderDate){
        const orderSpanMonths = (p.lastOrderDate.getFullYear()*12 + p.lastOrderDate.getMonth()) - (p.firstOrderDate.getFullYear()*12 + p.firstOrderDate.getMonth()) + 1;
        p.orderActiveSpanMonths = orderSpanMonths;
        p.orderRegularity = p.orderMonths.size / orderSpanMonths;
        p.daysSinceLastOrder = Math.floor((today - p.lastOrderDate) / 86400000);
      } else {
        p.orderActiveSpanMonths = 0;
        p.orderRegularity = 0;
        p.daysSinceLastOrder = null;
      }
    });

    const REGULARITY_THRESHOLD = 0.6; // 活躍期間內至少6成月份都有紀錄，才算「規律」

    // ---- 近30天無出貨：過去出貨很規律，但近30天完全沒出貨。排除還有欠貨在途的（那是「待出貨清單」在追蹤的範圍，這裡不重複通報）----
    const noShipmentItems = products
      .filter(p => p.activeSpanMonths >= 3 && p.regularity >= REGULARITY_THRESHOLD && p.recent30Qty === 0 && p.owed === 0)
      .sort((a,b) => b.daysSinceLastShip - a.daysSinceLastShip);

    // ---- 出貨量下降：近30天有出貨，但明顯低於平常步調 ----
    const declineItems = products
      .filter(p => p.activeSpanMonths >= 3 && p.regularity >= REGULARITY_THRESHOLD && p.recent30Qty > 0 && p.t30.dir === 'down')
      .sort((a,b) => a.t30.pct - b.t30.pct);

    // ---- 近30天無下單：過去下單很規律，但近30天完全沒有新訂單。跟出貨狀況無關，是客戶「下單行為」本身的訊號 ----
    const noOrderItems = products
      .filter(p => p.orderActiveSpanMonths >= 3 && p.orderRegularity >= REGULARITY_THRESHOLD && p.recentOrder30Qty === 0)
      .sort((a,b) => b.daysSinceLastOrder - a.daysSinceLastOrder);

    // ---- 用量異常增加：近30天明顯高於平常步調，可能要提前備貨或留意大單 ----
    const surgeItems = products
      .filter(p => p.activeSpanMonths >= 3 && p.regularity >= REGULARITY_THRESHOLD && p.t30.dir === 'up')
      .sort((a,b) => b.t30.pct - a.t30.pct);

    let watchHtml = '';
    if(surgeItems.length > 0){
      watchHtml += `
        <div class="watchlist-block" style="border-color:var(--jade); border-left-color:var(--jade);">
          <div class="watchlist-title" style="color:var(--jade);">📈 用量異常增加（${surgeItems.length}）</div>
          ${surgeItems.map(p => `
              <div class="watch-row">
                <div>
                  <div class="w-name">${escapeHtml(p.name || p.code)}</div>
                  <div class="w-code">${escapeHtml(p.code)} · 全期月均 ${fmtInt(p.fullAvg)}</div>
                </div>
                <div class="w-tag" style="color:var(--jade);">▲ 較平常增加 ${Math.abs(p.t30.pct).toFixed(0)}%</div>
              </div>
            `).join('')}
        </div>
      `;
    }
    if(declineItems.length > 0){
      watchHtml += `
        <div class="watchlist-block">
          <div class="watchlist-title">⚠ 出貨量下降（${declineItems.length}）</div>
          ${declineItems.map(p => `
              <div class="watch-row">
                <div>
                  <div class="w-name">${escapeHtml(p.name || p.code)}</div>
                  <div class="w-code">${escapeHtml(p.code)} · 全期月均 ${fmtInt(p.fullAvg)}</div>
                </div>
                <div class="w-tag">▼ 較平常下降 ${Math.abs(p.t30.pct).toFixed(0)}%</div>
              </div>
            `).join('')}
        </div>
      `;
    }
    if(noShipmentItems.length > 0){
      watchHtml += `
        <div class="watchlist-block">
          <div class="watchlist-title">🚫 近30天無出貨（${noShipmentItems.length}）</div>
          ${noShipmentItems.map(p => `
              <div class="watch-row">
                <div>
                  <div class="w-name">${escapeHtml(p.name || p.code)}</div>
                  <div class="w-code">${escapeHtml(p.code)} · 全期月均 ${fmtInt(p.fullAvg)}</div>
                </div>
                <div class="w-tag">已 ${p.daysSinceLastShip} 天沒出貨</div>
              </div>
            `).join('')}
        </div>
      `;
    }
    if(noOrderItems.length > 0){
      watchHtml += `
        <div class="watchlist-block">
          <div class="watchlist-title">📭 近30天無下單（${noOrderItems.length}）</div>
          ${noOrderItems.map(p => `
              <div class="watch-row">
                <div>
                  <div class="w-name">${escapeHtml(p.name || p.code)}</div>
                  <div class="w-code">${escapeHtml(p.code)} · 全期月均 ${fmtInt(p.fullAvg)}</div>
                </div>
                <div class="w-tag">已 ${p.daysSinceLastOrder} 天沒下單</div>
              </div>
            `).join('')}
        </div>
      `;
    }
    if(mergeLog.length > 0){
      watchHtml += `
        <div class="watchlist-block">
          <div class="watchlist-title">🔧 已自動合併的代碼（品名／代碼／單價，2項以上相符）（${mergeLog.length}組）</div>
          ${mergeLog.map(({from, into}) => `
              <div class="watch-row">
                <div>
                  <div class="w-name">${escapeHtml(from.code)}（${fmtInt(from.totalQty)}） <span style="color:var(--ink-dim);">已併入</span> ${escapeHtml(into.code)}（${fmtInt(into.totalQty)}）</div>
                  <div class="w-code">${escapeHtml(into.name || into.code)}</div>
                </div>
                <div class="w-tag">已合併</div>
              </div>
            `).join('')}
        </div>
      `;
    }
    watchlistEl.innerHTML = watchHtml;

    const grouped = {};
    products.forEach(p => {
      const cat = categorize(p.name);
      if(!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(p);
    });

    const renderRow = (p) => `
        <div class="stock-row">
          <div>
            <div class="s-name">${escapeHtml(p.name || p.code)}</div>
            <div class="s-code">${escapeHtml(p.code)}</div>
          </div>
          <div class="s-num"><span class="s-num-label">單價</span>${p.latestPrice ? fmtInt(p.latestPrice) + ' đ' : '—'}</div>
          <div class="s-num"><span class="s-num-label">全期月均</span>${fmtInt(p.fullAvg)}</div>
          <div class="s-num"><span class="s-num-label">近7天</span>${fmtInt(p.recent7Qty)}<span class="s-trend-mini ${p.t7.dir}">${p.t7.arrow}</span></div>
          <div class="s-num"><span class="s-num-label">近30天</span>${fmtInt(p.recent30Qty)}<span class="s-trend-mini ${p.t30.dir}">${p.t30.arrow}</span></div>
        </div>
      `;

    let html = '';
    CATEGORY_ORDER.forEach(cat => {
      const list = grouped[cat];
      if(!list || list.length === 0) return;
      html += `<div class="category-header">${cat}（${list.length}項）</div>`;
      if(DYE_CATEGORIES.includes(cat)){
        // 染料類：先依顏色排序（黃橘紅藍丈青紫黑），同色再依近7天用量排
        list.sort((a,b) => {
          const ca = colorSortIndex(a.name), cb = colorSortIndex(b.name);
          if(ca !== cb) return ca - cb;
          return b.recent7Qty - a.recent7Qty;
        });
      } else {
        list.sort((a,b) => b.recent7Qty - a.recent7Qty);
      }
      html += list.map(renderRow).join('');
    });
    stockListEl.innerHTML = html;
  }

  const pendingListEl = document.getElementById('pendingList');
  document.getElementById('pendingListCount').textContent = pending.length + ' 筆';
  if(pending.length === 0){
    pendingListEl.innerHTML = '<div class="empty">目前沒有待出貨品項</div>';
  } else {
    pendingListEl.innerHTML = pending
      .map(i => ({ i, stalledDays: i.dateObj ? Math.floor((today - i.dateObj) / 86400000) : null }))
      // 越久沒出貨的排越下面；沒有日期可判斷的（stalledDays 為 null）視為最新，排最上面
      .sort((a,b) => (a.stalledDays ?? -1) - (b.stalledDays ?? -1))
      .map(({i, stalledDays}) => `
        <div class="ledger-row">
          <div>
            <div class="r-name">${escapeHtml(i.name || i.code)}</div>
            <div class="r-code">${escapeHtml(i.code)}</div>
          </div>
          <div class="r-qty">還欠 ${fmtInt(i.owed)}</div>
          <div class="chop">${stalledDays !== null ? `停滯 ${stalledDays} 天` : '待出貨'}</div>
          <div class="r-date">${escapeHtml(i.date)}</div>
        </div>
      `).join('');
  }

}

let trendExpanded = false;
function toggleTrendHistory(){
  trendExpanded = !trendExpanded;
  document.querySelectorAll('#trendList .trend-extra').forEach(el => {
    el.style.display = trendExpanded ? '' : 'none';
  });
  const btn = document.getElementById('trendToggleBtn');
  if(btn) btn.textContent = trendExpanded ? '收合 ▴' : '顯示更早的月份 ▾';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
